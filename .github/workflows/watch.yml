name: Watch

# The mechanism behind the claim on the front page: this list does not rot because
# nobody is trusted to remember it. Weekly, the job re-reads every vendor's own source,
# rewrites news.md from what it finds, and opens an issue when something needs a human.
#
# It commits news.md. That is the only file a machine owns here — every page describing a
# tool's shape is written by a person, on purpose.

on:
  schedule:
    - cron: "20 6 * * 1" # Monday morning; a week is the right resolution for this
  workflow_dispatch:

permissions:
  contents: write # to commit the regenerated news.md
  issues: write # to report dead links and fresh announcements

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # No install step: the script is stdlib-only, which is deliberate for a job whose
      # whole purpose is to still work unattended a year from now.
      - name: Read every vendor source and check every link
        run: node scripts/watch.mjs

      - name: Commit news.md if it changed
        run: |
          git config user.name "agents-compared watcher"
          git config user.email "actions@github.com"
          if git diff --quiet news.md; then
            echo "no change"
          else
            git add news.md
            git commit -m "chore(news): refresh from vendor sources"
            git push
          fi

      - name: Open an issue if anything needs a human, and say so in Telegram
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          notify() {
            # Optional by design: with no bot configured the issue is still the record of
            # what happened, and this job must not fail over a missing notification.
            if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then return 0; fi
            curl -sS -o /dev/null --max-time 20 \
              "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TG_CHAT" \
              --data-urlencode "text=$1" \
              --data-urlencode "disable_web_page_preview=true" || true
          }

          existing=$(gh issue list --label staleness --state open --limit 1 \
            --json number,createdAt,title --jq '.[0] | select(.) | "\(.number) \(.createdAt)"')
          number=${existing%% *}
          created=${existing#* }
          issue_url="$GITHUB_SERVER_URL/$GH_REPO/issues/$number"

          if [ -s .watch-report.md ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file .watch-report.md
              echo "added findings to #$number"
            else
              url=$({ cat .watch-report.md; printf '\n\nRun: %s\n' "$RUN_URL"; } \
                | gh issue create --title "Watcher: pages may need a look" --label staleness --body-file -)
              echo "opened $url"
              # Announce only a NEW issue. Repeating the same alert weekly is how a channel
              # gets muted, and a muted channel is worse than none because it looks covered.
              notify "$(printf 'agents-compared: the watcher found something\n\n%s\n\n%s' \
                "$(head -c 400 .watch-report.md)" "$url")"
            fi
          else
            echo "nothing new to report"
          fi

          # Nag about an issue that has been sitting open. Once a week the job runs, so this
          # is at most one reminder per week — and only after a full week of being ignored,
          # which is long enough that "I will look later" has already failed once.
          if [ -n "$number" ]; then
            age_days=$(( ( $(date +%s) - $(date -d "$created" +%s) ) / 86400 ))
            echo "issue #$number is $age_days days old"
            if [ "$age_days" -ge 7 ]; then
              notify "$(printf 'agents-compared: issue #%s has been open for %s days\n\n%s\n\nClose it or fix what it names — the list is only trustworthy while this stays empty.' \
                "$number" "$age_days" "$issue_url")"
            fi
          fi
